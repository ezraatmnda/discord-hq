name: Sync Upstream

on:
  # Allows triggering from external API calls
  repository_dispatch:
    types: [upstream_push]
  # Fallback timer (e.g., every 6 hours) just in case
  schedule:
    - cron: '0 */6 * * *'
  # Manual button in the Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: main # Your fork's branch
          fetch-depth: 0

      - name: Sync upstream changes
        uses: a2ren/upstream-sync@v3.3.0
        with:
          upstream_sync_repo: owner/original-repo
          upstream_sync_branch: main # Original repo's branch
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false